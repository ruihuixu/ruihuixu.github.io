<section class="hero planet-hero" id="home">
  <!-- 深暖夜空背景 -->
  <div class="space-bg">
    <div class="star-field"></div>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
  </div>

  <!-- 轨道系统 -->
  <div class="solar-system" aria-label="博客目录">
    <!-- 中央主星(纯图形, 无文字) -->
    <div class="sun">
      <div class="sun-core"></div>
      <div class="sun-glow"></div>
    </div>

    <!-- 轨道 1: 阅读 -->
    <div class="orbit orbit-1">
      <div class="orbit-path"></div>
      <a href="/reading/" class="planet planet-reading" data-label="阅读">
        <span class="planet-body"></span>
        <span class="planet-ring"></span>
        <span class="planet-halo"></span>
      </a>
    </div>

    <!-- 轨道 2: 杂谈 -->
    <div class="orbit orbit-2">
      <div class="orbit-path"></div>
      <a href="/misc/" class="planet planet-misc" data-label="杂谈">
        <span class="planet-body"></span>
        <span class="planet-ring"></span>
        <span class="planet-halo"></span>
      </a>
    </div>

    <!-- 轨道 3: 关于我 -->
    <div class="orbit orbit-3">
      <div class="orbit-path"></div>
      <a href="/profile/" class="planet planet-about" data-label="关于我">
        <span class="planet-body"></span>
        <span class="planet-ring"></span>
        <span class="planet-halo"></span>
      </a>
    </div>
  </div>

  <!-- 底部滚动提示 -->
  <div class="scroll-hint">
    <span>向下滚动</span>
    <div class="scroll-line"></div>
  </div>
</section>
