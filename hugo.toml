baseURL = 'https://rayx750.github.io/' # 请确认这里是你的 GitHub Pages 网址
languageCode = 'zh-cn'
title = 'Ruihui Xu' # 网站标题
# theme = 'ananke' # Disabled for custom theme
# sectionPagesMenu = "main"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[markup.goldmark.renderer]
  unsafe = true  # allow raw HTML like <details> in markdown

[params]
  description = "读书 · 杂谈 · 技术笔记"
  mainSections = ["misc", "projects", "profile"]

[menu]
