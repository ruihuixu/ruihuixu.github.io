  [[menu.main]]
    identifier = "home"
    name = "HOME"
    url = "/"
    weight = 0

  # Profile - Right side
  [[menu.main]]
    identifier = "profile"
    name = "Profile"
    url = "/profile/"
    weight = 10

  # Projects
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20

  # Misc
  [[menu.main]]
    identifier = "misc"
